<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#080e1a"/>
<title>Incidents | NIDS-Live</title>
<style>
:root{--bg:#080e1a;--card:#0e1929;--line:#1c2c42;--text:#ecf5ff;--muted:#8299b3;--blue:#52b6ff;--red:#ff6c80;--green:#4de2a6;--amber:#ffb454}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}
.wrap{max-width:1000px;margin:auto;padding:28px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
h1{font-size:19px;margin:0}
a.back{color:var(--muted);font-size:12.5px;text-decoration:none}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px}
.sev{font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:4px 9px;border-radius:99px}
.sev.CRITICAL{background:#3a1522;color:var(--red)}.sev.HIGH{background:#3a2a15;color:var(--amber)}
.sev.MEDIUM,.sev.ELEVATED{background:#152a3a;color:var(--blue)}.sev.LOW{background:#122a22;color:var(--green)}
.status{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 9px}
.summary{flex:1;font-size:13px}
.meta{color:var(--muted);font-size:11.5px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
a.link{color:var(--blue);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Incidents</h1><a class="back" href="/monitor">← Back to monitor</a></header>
  <div id="list"><div class="empty">Loading…</div></div>
</div>
<script>
async function load(){
  const res=await fetch('/api/incidents',{cache:'no-store'});
  const items=await res.json();
  const list=document.getElementById('list');
  if(!items.length){list.innerHTML='<div class="empty">No incidents recorded yet.</div>';return}
  list.innerHTML=items.map(i=>`<a class="link" href="/incident/${i.id}"><div class="row">
    <span class="sev ${i.severity}">${i.severity}</span>
    <span class="summary">${i.summary}</span>
    <span class="meta">${i.category} · ${i.event_count} event(s)</span>
    <span class="status">${i.status}</span>
  </div></a>`).join('');
}
load();setInterval(load,4000);
</script>
</body>
</html>
